server {
    server_name digitalsage.cloud www.digitalsage.cloud;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8103;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/digitalsage.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/digitalsage.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.digitalsage.cloud) {
        return 301 https://$host$request_uri;
    }

    if ($host = digitalsage.cloud) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name digitalsage.cloud www.digitalsage.cloud;
    return 404;
}

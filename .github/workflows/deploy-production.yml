name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python entrypoints
        run: python -m py_compile ai_engine/cartoon_avatars.py ai_engine/demo_story.py tools/render_demo_film.py api/app.py

      - name: Validate deploy script
        run: bash -n tools/deploy_server.sh

      - name: Prepare SSH key
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_SSH_KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/digital_sage_deploy"
          chmod 600 "$HOME/.ssh/digital_sage_deploy"
          ssh-keyscan -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Deploy to production server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEEPSEEK_API_BASE: ${{ secrets.DEEPSEEK_API_BASE }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          DEEPSEEK_FALLBACK_MODEL: ${{ secrets.DEEPSEEK_FALLBACK_MODEL }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_CURRENCY: ${{ secrets.STRIPE_CURRENCY }}
          CREEM_API_BASE: ${{ secrets.CREEM_API_BASE }}
          CREEM_API_KEY: ${{ secrets.CREEM_API_KEY }}
          CREEM_PRODUCT_VOICE_10: ${{ secrets.CREEM_PRODUCT_VOICE_10 }}
          CREEM_PRODUCT_VOICE_20: ${{ secrets.CREEM_PRODUCT_VOICE_20 }}
          CREEM_PRODUCT_VIDEO_30: ${{ secrets.CREEM_PRODUCT_VIDEO_30 }}
          CREEM_PRODUCT_STRATEGY_60: ${{ secrets.CREEM_PRODUCT_STRATEGY_60 }}
          CREEM_PRODUCT_MEMORY_SUBSCRIPTION: ${{ secrets.CREEM_PRODUCT_MEMORY_SUBSCRIPTION }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEEPSEEK_API_KEY"
          HOST="${DEPLOY_USER}@${DEPLOY_HOST}" \
          SSH_KEY="$HOME/.ssh/digital_sage_deploy" \
          DEEPSEEK_API_BASE="${DEEPSEEK_API_BASE:-https://api.deepseek.com}" \
          DEEPSEEK_API_KEY="$DEEPSEEK_API_KEY" \
          DEEPSEEK_MODEL="${DEEPSEEK_MODEL:-deepseek-v4-pro}" \
          DEEPSEEK_FALLBACK_MODEL="${DEEPSEEK_FALLBACK_MODEL:-deepseek-chat}" \
          PUBLIC_BASE_URL="${PUBLIC_BASE_URL:-https://www.digitalsage.cloud}" \
          STRIPE_SECRET_KEY="$STRIPE_SECRET_KEY" \
          STRIPE_CURRENCY="${STRIPE_CURRENCY:-cny}" \
          CREEM_API_BASE="${CREEM_API_BASE:-https://api.creem.io}" \
          CREEM_API_KEY="$CREEM_API_KEY" \
          CREEM_PRODUCT_VOICE_10="$CREEM_PRODUCT_VOICE_10" \
          CREEM_PRODUCT_VOICE_20="$CREEM_PRODUCT_VOICE_20" \
          CREEM_PRODUCT_VIDEO_30="$CREEM_PRODUCT_VIDEO_30" \
          CREEM_PRODUCT_STRATEGY_60="$CREEM_PRODUCT_STRATEGY_60" \
          CREEM_PRODUCT_MEMORY_SUBSCRIPTION="$CREEM_PRODUCT_MEMORY_SUBSCRIPTION" \
          ./tools/deploy_server.sh

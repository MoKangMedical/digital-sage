<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="bg_ren_zhengfei" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="gold_ren_zhengfei" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="accent_ren_zhengfei" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow_ren_zhengfei" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip_ren_zhengfei">
      <rect x="0" y="0" width="400" height="600" rx="16"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="400" height="600" rx="16" fill="url(#bg_ren_zhengfei)"/>
  
  <!-- Decorative top bar -->
  <rect x="0" y="0" width="400" height="4" fill="url(#gold_ren_zhengfei)" rx="0"/>
  
  <!-- Subtle corner decoration -->
  <circle cx="380" cy="40" r="60" fill="#f59e0b" opacity="0.03"/>
  <circle cx="380" cy="40" r="40" fill="#f59e0b" opacity="0.05"/>
  <circle cx="380" cy="40" r="20" fill="#f59e0b" opacity="0.08"/>
  
  <!-- Left accent line -->
  <rect x="24" y="80" width="3" height="80" rx="2" fill="url(#gold_ren_zhengfei)" opacity="0.6"/>
  
  <!-- Category icon circle -->
  <circle cx="60" cy="60" r="28" fill="#f59e0b" opacity="0.15"/>
  <text x="60" y="70" text-anchor="middle" font-size="28">📈</text>
  
  <!-- Category label -->
  <rect x="100" y="42" width="76" height="26" rx="13" fill="#f59e0b" opacity="0.2"/>
  <text x="138.0" y="60" text-anchor="middle" fill="#f59e0b" font-size="13" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="500">商业投资</text>
  
  <!-- Sage Name -->
  <text x="40" y="120" fill="#fbbf24" font-size="32" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="700">任正非</text>
  
  <!-- Title -->
  <text x="40" y="155" fill="#94a3b8" font-size="16" font-family="'Noto Sans SC', 'PingFang SC', sans-serif">华为创始人</text>
  
  <!-- Divider line -->
  <line x1="40" y1="175" x2="360" y2="175" stroke="#334155" stroke-width="1"/>
  
  <!-- Digital Sage Brand -->
  <text x="40" y="210" fill="#64748b" font-size="11" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" letter-spacing="2">DIGITAL SAGE 智者课程</text>
  
  <!-- Section: Core Domain -->
  <text x="40" y="250" fill="#fbbf24" font-size="13" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="600">◆ 核心领域</text>
  
  <!-- Domain tags -->
  <rect x="40" y="310" width="56" height="28" rx="14" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.5"/>
    <text x="68.0" y="329" text-anchor="middle" fill="#f59e0b" font-size="13" font-family="'Noto Sans SC', 'PingFang SC', sans-serif">灰度</text><rect x="106" y="310" width="56" height="28" rx="14" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.5"/>
    <text x="134.0" y="329" text-anchor="middle" fill="#f59e0b" font-size="13" font-family="'Noto Sans SC', 'PingFang SC', sans-serif">组织</text><rect x="172" y="310" width="88" height="28" rx="14" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.5"/>
    <text x="216.0" y="329" text-anchor="middle" fill="#f59e0b" font-size="13" font-family="'Noto Sans SC', 'PingFang SC', sans-serif">战略耐心</text>
  
  <!-- Section: Quote -->
  <text x="40" y="352" fill="#fbbf24" font-size="13" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="600">◆ 经典语录</text>
  
  <!-- Quote marks -->
  <text x="35" y="388" fill="#fbbf24" font-size="40" font-family="Georgia, serif" opacity="0.4">"</text>
  
  <!-- Quote text -->
  <text x="200.0" y="380" text-anchor="middle" fill="#e2e8f0" font-size="16" font-family="'Noto Sans SC', 'PingFang SC', 'STKaiti', serif" font-style="italic" opacity="0.9">"让听得见炮火的人做决策"</text>
    
  
  <!-- Closing quote -->
  <text x="345" y="420" fill="#fbbf24" font-size="40" font-family="Georgia, serif" opacity="0.4">"</text>
  
  <!-- Bottom decorative area -->
  <line x1="40" y1="500" x2="360" y2="500" stroke="#334155" stroke-width="1"/>
  
  <!-- Bottom brand -->
  <text x="200.0" y="535" text-anchor="middle" fill="#475569" font-size="12" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" letter-spacing="1">与智者对话 · 体验思维的力量</text>
  
  <!-- Digital Sage logo text -->
  <text x="200.0" y="562" text-anchor="middle" fill="#fbbf24" font-size="14" font-family="Georgia, serif" font-weight="700" letter-spacing="3" opacity="0.7">DIGITAL SAGE</text>
  
  <!-- Bottom gold bar -->
  <rect x="0" y="596" width="400" height="4" fill="url(#gold_ren_zhengfei)" rx="0"/>
  
  <!-- Subtle grid pattern overlay -->
  <rect x="0" y="0" width="400" height="600" rx="16" fill="none" stroke="#1e293b" stroke-width="0.5" opacity="0.3"/>
</svg>